<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo dos Substantivos</title>
    <style>
        /* Estilos específicos para a página de jogos */
        body {
            background-color: #F29B38;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            padding-top: 100px; /* Para compensar a navbar fixa */
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #CA0700;
            text-align: center;
            margin-bottom: 30px;
        }

        .game-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .sentence {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option {
            padding: 10px 15px;
            background-color: #F29B38;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        .option:hover {
            background-color: #e08c30;
        }

        .feedback {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            min-height: 30px;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: #CA0700;
        }

        .score {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #CA0700;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #b00600;
        }

        .game-selection {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-type {
            padding: 15px 25px;
            background-color: #F29B38;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s;
        }

        .game-type.active {
            background-color: #CA0700;
        }

        .game-type:hover {
            background-color: #e08c30;
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .results-screen.active {
            display: block;
        }

        .results-summary {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .results-details {
            text-align: left;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .result-correct {
            color: green;
        }

        .result-incorrect {
            color: #CA0700;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #4CAF50;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="inicial.html">Home</a></li>
            <li><a href="jogo.html">Jogo</a></li>
            <li><a href="quiz.html">Quiz</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Caça aos Substantivos</h1>
        
        <div class="game-selection">
            <button class="game-type active" data-game="identify">Identificar Substantivos</button>
            <button class="game-type" data-game="classify">Classificar Substantivos</button>
        </div>
        
        <div class="game-area" id="identifyGame">
            <div class="score" id="progressIdentify">Pergunta 1 de 30</div>
            <div class="sentence" id="sentence">Carregando frase...</div>
            <div class="options" id="options">
                <!-- As opções serão preenchidas pelo JavaScript -->
            </div>
            <div class="feedback" id="feedback"></div>
            <div class="score" id="score">Pontuação: 0</div>
            <button class="btn" id="nextBtn">Próxima Frase</button>
        </div>
        
        <div class="game-area" id="classifyGame" style="display: none;">
            <div class="score" id="progressClassify">Pergunta 1 de 30</div>
            <div class="sentence" id="classifyWord">Carregando palavra...</div>
            <div class="options" id="classifyOptions">
                <!-- As opções de classificação serão preenchidas pelo JavaScript -->
            </div>
            <div class="feedback" id="classifyFeedback"></div>
            <div class="score" id="classifyScore">Pontuação: 0</div>
            <button class="btn" id="nextClassifyBtn">Próxima Palavra</button>
        </div>

        <div class="results-screen" id="resultsScreen">
            <h2>Jogo Concluído!</h2>
            <div class="results-summary">
                <h3>Resumo do Desempenho</h3>
                <p>Acertos: <span id="correctCount">0</span> de 30</p>
                <p>Erros: <span id="incorrectCount">0</span></p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <p id="performanceMessage"></p>
            </div>
            <div class="results-details" id="resultsDetails">
                <!-- Detalhes das respostas serão preenchidos aqui -->
            </div>
            <div>
                <button class="btn" id="playAgainBtn">Jogar Novamente</button>
                <button class="btn" id="changeGameBtn">Trocar Modo de Jogo</button>
                <button class="btn" id="homeBtn">Voltar para Home</button>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" id="resetBtn">Reiniciar Jogo</button>
        </div>
    </div>

    <script>
        // Dados para o jogo - 30 frases para identificar substantivos
        const sentences = [
            { sentence: "A menina brinca no parque com seu cachorro feliz.", nouns: ["menina", "parque", "cachorro"] },
            { sentence: "O amor e a amizade são sentimentos importantes na vida.", nouns: ["amor", "amizade", "sentimentos", "vida"] },
            { sentence: "O Brasil é um país com muitas belezas naturais.", nouns: ["Brasil", "país", "belezas"] },
            { sentence: "O guarda-chuva protege da chuva forte.", nouns: ["guarda-chuva", "chuva"] },
            { sentence: "A matilha de lobos caçava na floresta escura.", nouns: ["matilha", "lobos", "floresta"] },
            { sentence: "O professor explicou a lição para os alunos atentos.", nouns: ["professor", "lição", "alunos"] },
            { sentence: "A felicidade é um estado de espírito que todos buscam.", nouns: ["felicidade", "estado", "espírito"] },
            { sentence: "O livro sobre a história do mundo é muito interessante.", nouns: ["livro", "história", "mundo"] },
            { sentence: "A família viajou para a praia no final de semana.", nouns: ["família", "praia", "final", "semana"] },
            { sentence: "O médico receitou remédios para a criança doente.", nouns: ["médico", "remédios", "criança"] },
            { sentence: "A cidade tem muitos parques e praças arborizadas.", nouns: ["cidade", "parques", "praças"] },
            { sentence: "O time de futebol venceu o campeonato estadual.", nouns: ["time", "futebol", "campeonato"] },
            { sentence: "A música clássica acalma os corações agitados.", nouns: ["música", "corações"] },
            { sentence: "O computador processa informações com rapidez.", nouns: ["computador", "informações", "rapidez"] },
            { sentence: "A esperança move as pessoas em momentos difíceis.", nouns: ["esperança", "pessoas", "momentos"] },
            { sentence: "O restaurante serve pratos típicos da região.", nouns: ["restaurante", "pratos", "região"] },
            { sentence: "A liberdade é um direito fundamental do ser humano.", nouns: ["liberdade", "direito", "ser", "humano"] },
            { sentence: "O rio Amazonas é o maior do mundo em volume de água.", nouns: ["rio", "Amazonas", "mundo", "volume", "água"] },
            { sentence: "A inteligência artificial transforma a tecnologia.", nouns: ["inteligência", "tecnologia"] },
            { sentence: "O beija-flor voa rapidamente de flor em flor.", nouns: ["beija-flor"] },
            { sentence: "A paciência é uma virtude que deve ser cultivada.", nouns: ["paciência", "virtude"] },
            { sentence: "O cinema exibiu um filme de aventura emocionante.", nouns: ["cinema", "filme", "aventura"] },
            { sentence: "A justiça deve ser igual para todos os cidadãos.", nouns: ["justiça", "cidadãos"] },
            { sentence: "O segundo-feira é o primeiro dia útil da semana.", nouns: ["segunda-feira", "dia", "semana"] },
            { sentence: "A natureza oferece beleza e recursos importantes.", nouns: ["natureza", "beleza", "recursos"] },
            { sentence: "O conhecimento abre portas para o futuro.", nouns: ["conhecimento", "portas", "futuro"] },
            { sentence: "A escola promove a educação das crianças.", nouns: ["escola", "educação", "crianças"] },
            { sentence: "O esporte desenvolve habilidades e valores.", nouns: ["esporte", "habilidades", "valores"] },
            { sentence: "A ciência busca respostas para os mistérios do universo.", nouns: ["ciência", "respostas", "mistérios", "universo"] },
            { sentence: "O coração bate forte durante os exercícios físicos.", nouns: ["coração", "exercícios"] }
        ];

        // Dados para o jogo - 30 palavras para classificar
        const wordsToClassify = [
            { word: "casa", type: "comum" },
            { word: "Brasil", type: "próprio" },
            { word: "amor", type: "abstrato" },
            { word: "cardume", type: "coletivo" },
            { word: "guarda-chuva", type: "composto" },
            { word: "flor", type: "simples" },
            { word: "Rio de Janeiro", type: "próprio" },
            { word: "tristeza", type: "abstrato" },
            { word: "álbum", type: "coletivo" },
            { word: "beija-flor", type: "composto" },
            { word: "mesa", type: "comum" },
            { word: "Portugal", type: "próprio" },
            { word: "alegria", type: "abstrato" },
            { word: "matilha", type: "coletivo" },
            { word: "couve-flor", type: "composto" },
            { word: "livro", type: "simples" },
            { word: "São Paulo", type: "próprio" },
            { word: "raiva", type: "abstrato" },
            { word: "enxame", type: "coletivo" },
            { word: "pé-de-moleque", type: "composto" },
            { word: "cadeira", type: "comum" },
            { word: "França", type: "próprio" },
            { word: "medo", type: "abstrato" },
            { word: "arquipélago", type: "coletivo" },
            { word: "aguardente", type: "composto" },
            { word: "árvore", type: "simples" },
            { word: "Minas Gerais", type: "próprio" },
            { word: "esperança", type: "abstrato" },
            { word: "constelação", type: "coletivo" },
            { word: "passatempo", type: "composto" }
        ];

        // Elementos DOM
        const sentenceElement = document.getElementById('sentence');
        const optionsElement = document.getElementById('options');
        const feedbackElement = document.getElementById('feedback');
        const scoreElement = document.getElementById('score');
        const nextBtn = document.getElementById('nextBtn');
        const progressIdentify = document.getElementById('progressIdentify');
        
        const classifyWordElement = document.getElementById('classifyWord');
        const classifyOptionsElement = document.getElementById('classifyOptions');
        const classifyFeedbackElement = document.getElementById('classifyFeedback');
        const classifyScoreElement = document.getElementById('classifyScore');
        const nextClassifyBtn = document.getElementById('nextClassifyBtn');
        const progressClassify = document.getElementById('progressClassify');
        
        const resetBtn = document.getElementById('resetBtn');
        const gameTypes = document.querySelectorAll('.game-type');
        const identifyGame = document.getElementById('identifyGame');
        const classifyGame = document.getElementById('classifyGame');
        
        const resultsScreen = document.getElementById('resultsScreen');
        const correctCount = document.getElementById('correctCount');
        const incorrectCount = document.getElementById('incorrectCount');
        const progressFill = document.getElementById('progressFill');
        const performanceMessage = document.getElementById('performanceMessage');
        const resultsDetails = document.getElementById('resultsDetails');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const changeGameBtn = document.getElementById('changeGameBtn');
        const homeBtn = document.getElementById('homeBtn');

        // Variáveis de estado
        let currentSentenceIndex = 0;
        let currentWordIndex = 0;
        let score = 0;
        let classifyScore = 0;
        let gameType = 'identify';
        let userAnswers = [];

        // Inicializar o jogo
        function initGame() {
            loadSentence();
            loadWordToClassify();
            
            // Event listeners
            nextBtn.addEventListener('click', nextSentence);
            nextClassifyBtn.addEventListener('click', nextWord);
            resetBtn.addEventListener('click', resetGame);
            playAgainBtn.addEventListener('click', playAgain);
            changeGameBtn.addEventListener('click', changeGame);
            homeBtn.addEventListener('click', goHome);
            
            // Event listeners para troca de tipo de jogo
            gameTypes.forEach(type => {
                type.addEventListener('click', () => {
                    gameTypes.forEach(t => t.classList.remove('active'));
                    type.classList.add('active');
                    
                    gameType = type.dataset.game;
                    
                    if (gameType === 'identify') {
                        identifyGame.style.display = 'block';
                        classifyGame.style.display = 'none';
                    } else {
                        identifyGame.style.display = 'none';
                        classifyGame.style.display = 'block';
                    }
                    
                    resetGame();
                });
            });
        }

        // Carregar uma nova frase
        function loadSentence() {
            if (currentSentenceIndex >= sentences.length) {
                showResults();
                return;
            }
            
            const currentSentence = sentences[currentSentenceIndex];
            sentenceElement.textContent = currentSentence.sentence;
            progressIdentify.textContent = `Pergunta ${currentSentenceIndex + 1} de ${sentences.length}`;
            
            // Limpar opções anteriores
            optionsElement.innerHTML = '';
            feedbackElement.textContent = '';
            feedbackElement.className = 'feedback';
            
            // Criar opções (algumas são substantivos, outras não)
            const allWords = currentSentence.sentence.replace(/[.,!?]/g, '').split(' ');
            const nonNouns = allWords.filter(word => !currentSentence.nouns.includes(word));
            
            // Selecionar algumas palavras que não são substantivos
            const selectedNonNouns = [];
            for (let i = 0; i < Math.min(2, nonNouns.length); i++) {
                const randomIndex = Math.floor(Math.random() * nonNouns.length);
                selectedNonNouns.push(nonNouns[randomIndex]);
                nonNouns.splice(randomIndex, 1);
            }
            
            // Combinar substantivos e não substantivos
            const allOptions = [...currentSentence.nouns, ...selectedNonNouns];
            
            // Embaralhar as opções
            shuffleArray(allOptions);
            
            // Adicionar opções ao DOM
            allOptions.forEach(word => {
                const button = document.createElement('button');
                button.textContent = word;
                button.className = 'option';
                button.addEventListener('click', () => checkAnswer(word, currentSentence.nouns, currentSentence.sentence));
                optionsElement.appendChild(button);
            });
        }

        // Carregar uma nova palavra para classificar
        function loadWordToClassify() {
            if (currentWordIndex >= wordsToClassify.length) {
                showResults();
                return;
            }
            
            const currentWord = wordsToClassify[currentWordIndex];
            classifyWordElement.textContent = `Classifique a palavra: "${currentWord.word}"`;
            progressClassify.textContent = `Pergunta ${currentWordIndex + 1} de ${wordsToClassify.length}`;
            
            // Limpar opções anteriores
            classifyOptionsElement.innerHTML = '';
            classifyFeedbackElement.textContent = '';
            classifyFeedbackElement.className = 'feedback';
            
            // Tipos de substantivos
            const types = ['comum', 'próprio', 'abstrato', 'coletivo', 'composto', 'simples'];
            
            // Embaralhar os tipos
            shuffleArray(types);
            
            // Adicionar opções ao DOM
            types.forEach(type => {
                const button = document.createElement('button');
                button.textContent = type.charAt(0).toUpperCase() + type.slice(1);
                button.className = 'option';
                button.addEventListener('click', () => checkClassification(type, currentWord.type, currentWord.word));
                classifyOptionsElement.appendChild(button);
            });
        }

        // Verificar resposta no jogo de identificação
        function checkAnswer(selectedWord, correctNouns, sentence) {
            const isCorrect = correctNouns.includes(selectedWord);
            
            // Salvar resposta do usuário
            userAnswers.push({
                type: 'identify',
                question: sentence,
                selected: selectedWord,
                correct: isCorrect ? '✓' : '✗',
                isCorrect: isCorrect
            });
            
            if (isCorrect) {
                feedbackElement.textContent = 'Correto! "' + selectedWord + '" é um substantivo.';
                feedbackElement.className = 'feedback correct';
                score++;
                scoreElement.textContent = 'Pontuação: ' + score;
            } else {
                feedbackElement.textContent = 'Incorreto! "' + selectedWord + '" não é um substantivo.';
                feedbackElement.className = 'feedback incorrect';
            }
            
            // Desabilitar todos os botões após a resposta
            const allButtons = optionsElement.querySelectorAll('.option');
            allButtons.forEach(button => {
                button.disabled = true;
                
                // Destacar a resposta correta
                if (correctNouns.includes(button.textContent)) {
                    button.style.backgroundColor = 'green';
                } else if (button.textContent === selectedWord && !isCorrect) {
                    button.style.backgroundColor = '#CA0700';
                }
            });
        }

        // Verificar resposta no jogo de classificação
        function checkClassification(selectedType, correctType, word) {
            const isCorrect = selectedType === correctType;
            
            // Salvar resposta do usuário
            userAnswers.push({
                type: 'classify',
                question: word,
                selected: selectedType,
                correct: correctType,
                isCorrect: isCorrect
            });
            
            if (isCorrect) {
                classifyFeedbackElement.textContent = 'Correto! "' + selectedType + '" é a classificação correta.';
                classifyFeedbackElement.className = 'feedback correct';
                classifyScore++;
                classifyScoreElement.textContent = 'Pontuação: ' + classifyScore;
            } else {
                classifyFeedbackElement.textContent = 'Incorreto! A classificação correta é "' + correctType + '".';
                classifyFeedbackElement.className = 'feedback incorrect';
            }
            
            // Desabilitar todos os botões após a resposta
            const allButtons = classifyOptionsElement.querySelectorAll('.option');
            allButtons.forEach(button => {
                button.disabled = true;
                
                // Destacar a resposta correta
                if (button.textContent.toLowerCase() === correctType) {
                    button.style.backgroundColor = 'green';
                } else if (button.textContent.toLowerCase() === selectedType && !isCorrect) {
                    button.style.backgroundColor = '#CA0700';
                }
            });
        }

        // Próxima frase
        function nextSentence() {
            currentSentenceIndex++;
            loadSentence();
        }

        // Próxima palavra
        function nextWord() {
            currentWordIndex++;
            loadWordToClassify();
        }

        // Mostrar resultados
        function showResults() {
            identifyGame.style.display = 'none';
            classifyGame.style.display = 'none';
            resultsScreen.classList.add('active');
            
            const totalQuestions = gameType === 'identify' ? sentences.length : wordsToClassify.length;
            const correctAnswers = gameType === 'identify' ? score : classifyScore;
            const incorrectAnswers = totalQuestions - correctAnswers;
            const percentage = (correctAnswers / totalQuestions) * 100;
            
            // Atualizar resumo
            correctCount.textContent = correctAnswers;
            incorrectCount.textContent = incorrectAnswers;
            progressFill.style.width = percentage + '%';
            
            // Mensagem de desempenho
            if (percentage >= 90) {
                performanceMessage.textContent = 'Excelente! Você é um expert em substantivos!';
            } else if (percentage >= 70) {
                performanceMessage.textContent = 'Muito bom! Você tem um ótimo conhecimento sobre substantivos.';
            } else if (percentage >= 50) {
                performanceMessage.textContent = 'Bom! Continue praticando para melhorar ainda mais.';
            } else {
                performanceMessage.textContent = 'Continue estudando! A prática leva à perfeição.';
            }
            
            // Mostrar detalhes das respostas
            resultsDetails.innerHTML = '';
            userAnswers.forEach((answer, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                
                if (answer.type === 'identify') {
                    resultItem.innerHTML = `
                        <p><strong>Frase ${index + 1}:</strong> ${answer.question}</p>
                        <p>Sua resposta: "${answer.selected}" - <span class="${answer.isCorrect ? 'result-correct' : 'result-incorrect'}">${answer.correct}</span></p>
                    `;
                } else {
                    resultItem.innerHTML = `
                        <p><strong>Palavra ${index + 1}:</strong> "${answer.question}"</p>
                        <p>Sua resposta: ${answer.selected} - Resposta correta: ${answer.correct} - <span class="${answer.isCorrect ? 'result-correct' : 'result-incorrect'}">${answer.isCorrect ? 'Correto' : 'Incorreto'}</span></p>
                    `;
                }
                
                resultsDetails.appendChild(resultItem);
            });
        }

        // Jogar novamente
        function playAgain() {
            resultsScreen.classList.remove('active');
            if (gameType === 'identify') {
                identifyGame.style.display = 'block';
            } else {
                classifyGame.style.display = 'block';
            }
            resetGame();
        }

        // Trocar modo de jogo
        function changeGame() {
            resultsScreen.classList.remove('active');
            gameType = gameType === 'identify' ? 'classify' : 'identify';
            
            if (gameType === 'identify') {
                identifyGame.style.display = 'block';
                classifyGame.style.display = 'none';
                gameTypes[0].classList.add('active');
                gameTypes[1].classList.remove('active');
            } else {
                identifyGame.style.display = 'none';
                classifyGame.style.display = 'block';
                gameTypes[0].classList.remove('active');
                gameTypes[1].classList.add('active');
            }
            
            resetGame();
        }

        // Reiniciar o jogo
        function resetGame() {
            score = 0;
            classifyScore = 0;
            currentSentenceIndex = 0;
            currentWordIndex = 0;
            userAnswers = [];
            scoreElement.textContent = 'Pontuação: 0';
            classifyScoreElement.textContent = 'Pontuação: 0';
            
            if (gameType === 'identify') {
                loadSentence();
            } else {
                loadWordToClassify();
            }
        }

        // Voltar para a página inicial
        function goHome() {
            window.location.href = 'inicial.html';
        }

        // Função para embaralhar array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Inicializar o jogo quando a página carregar
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
